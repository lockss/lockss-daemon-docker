services:
  lockss:
    image: lockss/lockss-daemon
    container_name: lockss
    # set hostname to same value as LOCKSS_HOSTNAME in /etc/lockss/config.dat
    hostname: <configure>
    env_file: lockss.env
    ports:
      - "9729:9729" # LCAP v3
      - "8081:8081" # LOCKSS Web Admin UI
    volumes:
      - type: bind
        source: /etc/lockss/config.dat
        target: /etc/lockss/config.dat
      # Storage area
      # Template: <local-filesytem>:<container-filesystem>
      # Example: /cache0:/cache0
      # Note:  more than one storage area is allowed, list each one
      - /<configure>:/<configure>
      # LOCKSS Log directory
      - /var/log/lockss:/var/log/lockss
      # Configure container with same timezone as Docker host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: always
    stop_grace_period: 1m
    healthcheck:
      test: "ss -n --listening --tcp | grep -P 'LISTEN.+:9729' || exit 1"
      timeout: 3s
      retries: 0
